<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Change Password — Ayini Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<script>(function(){var t=localStorage.getItem("ayini_theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>

<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-leaf">🌿</span>
      <span class="brand-text">Ayini <span>Home Products</span></span>
    </a>
    <div class="nav-links">
<a href="index.html" class="nav-link">Billing</a>
      <a href="saved-bills.html" class="nav-link">Saved Bills</a>
      <a href="inventory.html" class="nav-link active">Inventory</a>
      <a href="reports.html" class="nav-link">Reports</a>
      <a href="closing-summary.html" class="nav-link">Closing</a>
<a href="credit-bills.html" class="nav-link">Credits</a>
      <a href="purchases.html" class="nav-link">Purchases</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-left:auto">
      <span class="nav-date" id="navDate"></span>
      <span style="font-size:12px;color:rgba(255,255,255,0.6)" id="navUser"></span>
      <button onclick="Auth.logout()" style="background:rgba(255,255,255,0.12);border:none;color:rgba(255,255,255,0.7);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer">Logout</button>
    </div>
  </div>
</nav>

<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 60px);background:var(--cream);padding:2rem">
  <div style="width:100%;max-width:420px">

    <div style="text-align:center;margin-bottom:2rem">
      <div style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--green-800)">Change Password</div>
      <div style="font-size:13px;color:var(--text-muted);margin-top:4px">Update your account password</div>
    </div>

    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;box-shadow:var(--shadow-md)">

      <!-- Success message -->
      <div id="successMsg" style="display:none;background:var(--green-50);color:var(--green-700);border:1px solid var(--green-200);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;margin-bottom:16px;display:none">
        ✓ Password changed successfully! Redirecting to login...
      </div>

      <!-- Error message -->
      <div id="errorMsg" style="display:none;background:var(--red-100);color:var(--red-600);border:1px solid #f5bcbc;border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;margin-bottom:16px"></div>

      <div style="display:flex;flex-direction:column;gap:18px">

        <div class="field-group">
          <label class="field-label" style="color:var(--text-muted)">Current Password</label>
          <div style="position:relative">
            <input type="password" id="currentPwd" class="text-input" placeholder="Enter current password" style="padding-right:40px"/>
            <button onclick="togglePwd('currentPwd','eyeC')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:2px">
              <svg id="eyeC" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" style="color:var(--text-muted)">New Password</label>
          <div style="position:relative">
            <input type="password" id="newPwd" class="text-input" placeholder="Enter new password (min 6 chars)" style="padding-right:40px" oninput="checkStrength()"/>
            <button onclick="togglePwd('newPwd','eyeN')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:2px">
              <svg id="eyeN" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <!-- Password strength bar -->
          <div id="strengthWrap" style="margin-top:6px;display:none">
            <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden">
              <div id="strengthBar" style="height:100%;width:0%;border-radius:2px;transition:all 0.3s"></div>
            </div>
            <div id="strengthText" style="font-size:11px;margin-top:3px;color:var(--text-muted)"></div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" style="color:var(--text-muted)">Confirm New Password</label>
          <div style="position:relative">
            <input type="password" id="confirmPwd" class="text-input" placeholder="Re-enter new password" style="padding-right:40px" oninput="checkMatch()"/>
            <button onclick="togglePwd('confirmPwd','eyeCF')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:2px">
              <svg id="eyeCF" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div id="matchMsg" style="font-size:11px;margin-top:4px"></div>
        </div>

        <button id="submitBtn" onclick="changePassword()" style="width:100%;padding:12px;background:var(--green-700);color:#fff;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Change Password
        </button>

        <a href="index.html" style="text-align:center;font-size:13px;color:var(--text-muted);text-decoration:none;display:block">← Back to Billing</a>
      </div>
    </div>

    <div style="text-align:center;margin-top:1.25rem;font-size:12px;color:var(--text-muted)">
      Logged in as <strong id="currentUser" style="color:var(--green-700)"></strong>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
requireAuth();

// Show current username
const u = getUser();
if (u) document.getElementById('currentUser').textContent = u.username;

function togglePwd(inputId, eyeId) {
  const input = document.getElementById(inputId);
  const eye   = document.getElementById(eyeId);
  if (input.type === 'password') {
    input.type = 'text';
    eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function checkStrength() {
  const pwd  = document.getElementById('newPwd').value;
  const wrap = document.getElementById('strengthWrap');
  const bar  = document.getElementById('strengthBar');
  const txt  = document.getElementById('strengthText');
  if (!pwd) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  let score = 0;
  if (pwd.length >= 6)  score++;
  if (pwd.length >= 10) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;
  const levels = [
    { w:'20%', color:'#A32D2D', label:'Very weak' },
    { w:'40%', color:'#BA7517', label:'Weak' },
    { w:'60%', color:'#BA7517', label:'Fair' },
    { w:'80%', color:'#639922', label:'Strong' },
    { w:'100%',color:'#3B6D11', label:'Very strong' },
  ];
  const l = levels[Math.min(score, 4)];
  bar.style.width = l.w;
  bar.style.background = l.color;
  txt.style.color = l.color;
  txt.textContent = l.label;
}

function checkMatch() {
  const newPwd  = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const msg     = document.getElementById('matchMsg');
  if (!confirm) { msg.textContent = ''; return; }
  if (newPwd === confirm) {
    msg.style.color = 'var(--green-700)';
    msg.textContent = '✓ Passwords match';
  } else {
    msg.style.color = 'var(--red-600)';
    msg.textContent = '✗ Passwords do not match';
  }
}

async function changePassword() {
  const currentPwd = document.getElementById('currentPwd').value;
  const newPwd     = document.getElementById('newPwd').value;
  const confirmPwd = document.getElementById('confirmPwd').value;
  const btn        = document.getElementById('submitBtn');
  const errEl      = document.getElementById('errorMsg');
  const sucEl      = document.getElementById('successMsg');

  // Clear previous messages
  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  // Validate
  if (!currentPwd) { showError('Please enter your current password'); return; }
  if (!newPwd)     { showError('Please enter a new password'); return; }
  if (newPwd.length < 6) { showError('New password must be at least 6 characters'); return; }
  if (newPwd !== confirmPwd) { showError('New passwords do not match'); return; }
  if (currentPwd === newPwd) { showError('New password must be different from current password'); return; }

  btn.textContent = 'Changing...';
  btn.disabled = true;

  try {
    await Auth.changePassword(currentPwd, newPwd);
    sucEl.style.display = 'block';
    sucEl.textContent   = '✓ Password changed successfully! Please login again.';
    document.getElementById('currentPwd').value = '';
    document.getElementById('newPwd').value     = '';
    document.getElementById('confirmPwd').value = '';
    setTimeout(() => { Auth.logout(); }, 2000);
  } catch(e) {
    showError(e.message || 'Failed to change password');
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Change Password';
    btn.disabled = false;
  }
}

function showError(msg) {
  const errEl = document.getElementById('errorMsg');
  errEl.textContent   = msg;
  errEl.style.display = 'block';
}
</script>
</body>
</html>
