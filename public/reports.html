</head>

      <span class="brand-leaf">🌿</span>

    <div class="nav-links">

      <a href="saved-bills.html" class="nav-link">Saved Bills</a>
      <a href="inventory.html" class="nav-link">Inventory</a>
      <a href="reports.html" class="nav-link active">Reports</a>
      <a href="closing-summary.html" class="nav-link">Closing</a>
      <a href="credit-bills.html" class="nav-link">Credits</a>
            <a href="purchases.html" class="nav-link">Purchases</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-left:auto">
      <span class="nav-date" id="navDate"></span>
      <span style="font-size:12px;color:rgba(255,255,255,0.6)" id="navUser"></span>
      <a href="change-password.html" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;text-decoration:none">🔑 Password</a><button onclick="Auth.logout()" style="background:rgba(255,255,255,0.12);border:none;color:rgba(255,255,255,0.7);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer">Logout</button>
    </div>
  </div>
</nav>

<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Sales Reports</h1>
      <p class="page-sub">Overview of all billing activity</p>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-primary" onclick="exportToExcel()" style="background:#1D6F42;display:flex;align-items:center;gap:7px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Export to Excel
      </button>
      <button class="btn-primary" onclick="window.print()" style="background:var(--green-700);display:flex;align-items:center;gap:7px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print Report
      </button>
    </div>
  </div>

  <div class="stats-row" id="reportStats"></div>

  <div class="reports-grid">
    <div class="report-card">
      <div class="report-card-title">Recent Bills</div>
      <div class="table-toolbar" style="margin-bottom:12px">
        <div class="search-box-wrap" style="max-width:260px">
          <div class="search-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
          <input type="text" class="search-input" id="billSearch" placeholder="Search bills..." oninput="filterBills()"/>
        </div>
        <select id="payFilter" class="select-sm" onchange="filterBills()">
          <option value="">All Payments</option>
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
          <option value="Card">Card</option>
          <option value="Credit">Credit</option>
        </select>
      </div>
      <div class="inv-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Bill #</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Items</th>
              <th>Payment</th>
              <th>Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="billsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="report-card" style="max-width:320px">
      <div class="report-card-title">Top Products Sold</div>
      <div id="topProducts"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      Billing
    </a>
    <a href="saved-bills.html" class="mnav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Bills
    </a>
    <a href="inventory.html" class="mnav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      Inventory
    </a>
    <a href="reports.html" class="mnav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Reports
    </a>
  </div>
</nav>

</html>
