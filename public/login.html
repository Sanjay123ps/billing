<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Ayini Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--cream); }
  .login-wrap { width: 100%; max-width: 400px; padding: 2rem; }
  .login-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); }
  .login-brand { text-align: center; margin-bottom: 2rem; }
  .login-leaf  { font-size: 40px; display: block; margin-bottom: 10px; }
  .login-name  { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--green-800); }
  .login-sub   { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .login-form  { display: flex; flex-direction: column; gap: 16px; }
  .login-err   { background: var(--red-100); color: var(--red-600); border: 1px solid #f5bcbc; padding: 9px 14px; border-radius: var(--radius-sm); font-size: 13px; display: none; }
  .login-btn   { width: 100%; padding: 12px; background: var(--green-700); color: #fff; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .login-btn:hover { background: var(--green-800); }
  .login-hint  { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 1rem; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-leaf">🌿</span>
      <div class="login-name">Ayini Home Products</div>
      <div class="login-sub">Billing & Inventory System</div>
    </div>
    <div class="login-form">
      <div id="loginErr" class="login-err"></div>
      <div class="field-group">
        <label class="field-label" style="color:var(--text-muted)">Username</label>
        <input type="text" id="username" class="text-input" placeholder="Enter username" autofocus/>
      </div>
      <div class="field-group">
        <label class="field-label" style="color:var(--text-muted)">Password</label>
        <input type="password" id="password" class="text-input" placeholder="Enter password"/>
      </div>
      <button class="login-btn" onclick="doLogin()" id="loginBtn">Sign In</button>
    </div>

  </div>
</div>
<script src="api.js"></script>
<script>
  // Redirect if already logged in
  if (isLoggedIn()) window.location.href = '/';

  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('loginErr');
    const btn      = document.getElementById('loginBtn');
    if (!username || !password) { errEl.textContent = 'Please enter username and password'; errEl.style.display='block'; return; }
    btn.textContent = 'Signing in...'; btn.disabled = true;
    try {
      await Auth.login(username, password);
      window.location.href = '/';
    } catch (e) {
      errEl.textContent = e.message || 'Invalid credentials';
      errEl.style.display = 'block';
      btn.textContent = 'Sign In'; btn.disabled = false;
    }
  }
</script>
</body>
</html>
