<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory — Ayini Home Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-leaf">🌿</span>
      <span class="brand-text">Ayini <span>Home Products</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Billing</a>
      <a href="saved-bills.html" class="nav-link">Saved Bills</a>
      <a href="inventory.html" class="nav-link active">Inventory</a>
      <a href="reports.html" class="nav-link">Reports</a>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-left:auto">
      <span class="nav-date" id="navDate"></span>
      <span style="font-size:12px;color:rgba(255,255,255,0.6)" id="navUser"></span>
      <a href="change-password.html" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;text-decoration:none">🔑 Password</a><button onclick="Auth.logout()" style="background:rgba(255,255,255,0.12);border:none;color:rgba(255,255,255,0.7);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer">Logout</button>
    </div>
  </div>
</nav>

<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Inventory Management</h1>
      <p class="page-sub">Track stock levels across all Ayini products</p>
    </div>
    <button class="btn-primary" onclick="openAddProduct()">+ Add Product</button>
  </div>

  <div class="stats-row" id="invStats"></div>

  <div class="table-toolbar">
    <div class="search-box-wrap" style="max-width:320px">
      <div class="search-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <input type="text" id="invSearch" class="search-input" placeholder="Search products..." oninput="filterInv()"/>
    </div>
    <select id="catFilter" class="select-sm" onchange="filterInv()">
      <option value="">All Categories</option>
    </select>
    <select id="stockFilter" class="select-sm" onchange="filterInv()">
      <option value="">All Stock</option>
      <option value="low">Low Stock</option>
      <option value="out">Out of Stock</option>
      <option value="ok">In Stock</option>
    </select>
  </div>

  <div class="inv-table-wrap">
    <table class="data-table" id="invTable">
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Category</th>
          <th>Price (₹)</th>
          <th>Stock</th>
          <th>Status</th>
          <th>Adjust Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="invBody"></tbody>
    </table>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box" style="max-width:440px">
    <div class="modal-header">
      <h3 class="modal-title" id="prodModalTitle">Add Product</h3>
      <button class="modal-close" onclick="closeProdModal()">×</button>
    </div>
    <div class="modal-form">
      <input type="hidden" id="editId"/>
      <div class="field-group">
        <label class="field-label">Product Name</label>
        <input type="text" id="editName" class="text-input" placeholder="e.g. Coconut Oil 500ml"/>
      </div>
      <div class="form-row-2">
        <div class="field-group">
          <label class="field-label">Category</label>
          <select id="editCat" class="select-input">
<option>Masala Items</option>
<option>Pulses, Millets & Spices</option>
<option>Oil Items</option>
<option>Flour Items</option>
<option>Noodles & Semiya</option>
<option>Skin Care & Hair Care</option>
            
            
            
            
            
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Unit</label>
          <select id="editUnit" class="select-input">
            <option value="bottle">Bottle</option>
            <option value="pack">Pack</option>
            <option value="bar">Bar</option>
            <option value="kg">Kg</option>
          </select>
        </div>
      </div>
      <div class="form-row-2">
        <div class="field-group">
          <label class="field-label">Price (₹)</label>
          <input type="number" id="editPrice" class="text-input" placeholder="0" min="0"/>
        </div>
        <div class="field-group">
          <label class="field-label">Stock Qty</label>
          <input type="number" id="editStock" class="text-input" placeholder="0" min="0"/>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn btn-cancel" onclick="closeProdModal()">Cancel</button>
      <button class="modal-btn btn-confirm" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script src="api.js"></script>
<script src="inventory.js"></script>
</body>
</html>
